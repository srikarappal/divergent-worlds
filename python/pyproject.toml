[project]
name = "rlworld"
version = "0.1.0"
description = "Computer use RL world platform: specs, SDK, rewards and services"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "flask>=3.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
rlworld-export-schema = "rlworld.specs.schema:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --import-mode=importlib"
