[project]
name = "rlworld"
version = "0.1.0"
description = "Computer use RL world platform: specs, SDK, rewards and services"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.2",
    "cryptography>=43",
    "flask>=3.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pillow>=11",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
guest = ["websocket-client>=1.8"]
windows = [
    "comtypes>=1.4; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "websocket-client>=1.8",
]

[project.scripts]
rlworld = "rlworld.cli:main"
rlworld-export-schema = "rlworld.specs.schema:main"
rlworld-guest-agent = "rlworld.guest.main:main"
rlworld-windows-helper = "rlworld.guest.windows_main:main"
rlworld-build-image = "rlworld.images.builder:main"
rlworld-experimentd = "rlworld.services.experimentd_main:main"
rlworld-import-osworld = "rlworld.tasks.osworld:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "websocket-client>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --import-mode=importlib"
