# Policies the example specs play. Keys come from RLWORLD_SECRET_<API_KEY_SECRET> in experimentd's environment.
endpoints:
  # Qwen3.8 Flash on OpenRouter: the reference spec's policy.
  # export RLWORLD_SECRET_OPENROUTER=$OPENROUTER_API_KEY before starting experimentd.
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    allowed_models: [qwen/qwen3.8-flash]
    api_key_secret: openrouter
    max_concurrency: 8
    input_price_per_million_usd: 0.15
    output_price_per_million_usd: 0.47
  # An OpenAI compatible server on this machine, such as vLLM.
  - name: local_policy
    base_url: http://localhost:8000/v1
    allowed_models: [my_policy]
    provider_kind: self_hosted
